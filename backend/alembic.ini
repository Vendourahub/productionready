# A generic, single database configuration for Alembic.

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path prepend
prepend_sys_path = .

# Timezone configuration
timezone = UTC

# Max length of characters for "slug" field
truncate_slug_length = 40

# Database URL
sqlalchemy.url = sqlite:///./productionready.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
